<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FitHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* Design tokens from the original FormFit prototype. Light theme everywhere. */
  :root {
    color-scheme: light;
    --background: 0 0% 100%;
    --foreground: 220 13% 18%;
    --card: 220 14% 96%;
    --card-elevated: 220 14% 93%;
    --primary: 217 91% 60%;
    --primary-dark: 217 91% 52%;
    --muted-foreground: 220 9% 46%;
    --border: 220 13% 91%;
    --destructive: 0 84% 60%;
    --dark-navy: 222 24% 14%;
    --radius: 1rem;
  }
  * { box-sizing: border-box; }
  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    margin: 0; background: hsl(var(--background)); color: hsl(var(--foreground));
    min-height: 100vh; display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 480px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .screen { display: flex; flex-direction: column; gap: 16px; }
  [hidden] { display: none !important; }
  h1 {
    font-family: "Barlow Condensed", Inter, sans-serif; font-size: 30px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.01em; margin: 0;
  }
  p { color: hsl(var(--muted-foreground)); line-height: 1.5; margin: 0; }

  /* ---- Home screen (made-up gym app shell) ---- */
  #screenHome { padding-bottom: 84px; } /* room for the fixed tab bar */
  .home-header { display: flex; align-items: center; justify-content: space-between; padding: 4px 2px 0; }
  .home-header-brand { display: flex; align-items: center; gap: 10px; }
  .app-logo {
    width: 36px; height: 36px; border-radius: 10px; background: hsl(var(--dark-navy));
    color: white; display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .gym-name { font-family: "Barlow Condensed", Inter, sans-serif; font-size: 20px; font-weight: 700; text-transform: uppercase; }
  .home-header-icons { display: flex; gap: 8px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%; background: hsl(var(--card));
    border: none; display: flex; align-items: center; justify-content: center; font-size: 15px; cursor: pointer;
  }

  .greeting-sub { font-size: 15px; }
  .greeting-name { font-size: 32px; margin-top: 2px; }

  .today-card {
    background: hsl(var(--dark-navy)); border-radius: var(--radius); padding: 18px; color: white;
  }
  .today-card-top { display: flex; justify-content: space-between; align-items: center; }
  .today-label { font-size: 12px; letter-spacing: 0.08em; color: hsl(220 9% 60%); font-weight: 600; }
  .offpeak-pill {
    font-size: 11px; font-weight: 700; letter-spacing: 0.04em; padding: 4px 10px;
    border-radius: 999px; background: hsl(220 13% 28%); color: hsl(220 9% 75%);
  }
  .today-card-main { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 10px; }
  .today-count { font-family: "Barlow Condensed", Inter, sans-serif; font-size: 52px; font-weight: 700; line-height: 1; }
  .today-sub { font-size: 13px; color: hsl(220 9% 65%); margin-top: 4px; }
  .pulse-icon { width: 60px; height: 30px; color: hsl(var(--primary)); }
  .today-bar { height: 6px; border-radius: 3px; background: hsl(220 13% 28%); margin-top: 14px; overflow: hidden; }
  .today-bar-fill { height: 100%; background: hsl(var(--primary)); border-radius: 3px; }
  .today-bar-label { text-align: right; font-size: 12px; color: hsl(220 9% 65%); margin-top: 6px; }

  .quick-actions { display: flex; gap: 10px; }
  .quick-action {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px;
    background: hsl(var(--card)); border: none; border-radius: var(--radius); padding: 16px 8px; cursor: pointer;
  }
  .quick-action-icon {
    width: 40px; height: 40px; border-radius: 50%; background: white;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
    box-shadow: 0 1px 4px hsl(220 13% 18% / .1);
  }
  .quick-action-label { font-size: 11px; font-weight: 700; letter-spacing: 0.03em; color: hsl(var(--foreground)); }

  .section-heading-row { display: flex; justify-content: space-between; align-items: baseline; padding: 0 2px; }
  .section-heading { font-family: "Barlow Condensed", Inter, sans-serif; font-size: 18px; font-weight: 700; text-transform: uppercase; }
  .section-heading-muted { font-size: 12px; letter-spacing: 0.04em; color: hsl(var(--muted-foreground)); text-transform: uppercase; }

  /* The FormFit card is the only colourful thing on the home screen, so it
     reads as a partner feature inside the gym's app. */
  #formfitTile {
    display: block; text-align: left; border: none; border-radius: var(--radius); padding: 20px;
    cursor: pointer; color: white; width: 100%;
    background: linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary-dark)));
    box-shadow: 0 12px 28px -10px hsl(var(--primary) / .5);
  }
  .featured-card-top { display: flex; justify-content: space-between; align-items: center; }
  .new-pill {
    font-size: 11px; font-weight: 700; letter-spacing: 0.04em; padding: 4px 10px;
    border-radius: 999px; background: hsl(0 0% 100% / .25);
  }
  .featured-sparkle { font-size: 18px; }
  .formfit-tile-title { font-family: "Barlow Condensed", Inter, sans-serif; font-size: 24px; font-weight: 700; margin-top: 10px; text-transform: uppercase; }
  .formfit-tile-sub { font-size: 13px; color: hsl(0 0% 100% / .85); margin-top: 6px; line-height: 1.4; }
  .featured-cta {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 16px;
    background: white; color: hsl(var(--primary-dark)); font-weight: 700; font-size: 14px;
    padding: 10px 16px; border-radius: 999px;
  }

  .bottom-tab-bar {
    position: fixed; left: 0; right: 0; bottom: 0; background: white;
    border-top: 1px solid hsl(var(--border)); z-index: 10;
  }
  .bottom-tab-bar-inner {
    max-width: 480px; margin: 0 auto; display: flex; justify-content: space-around;
    padding: 8px 4px calc(8px + env(safe-area-inset-bottom, 0px));
  }
  .tab-item {
    background: none; border: none; display: flex; flex-direction: column; align-items: center;
    gap: 3px; color: hsl(var(--muted-foreground)); font-size: 10px; font-weight: 600; cursor: pointer;
    padding: 4px 8px;
  }
  .tab-item-active, .tab-item:hover { color: hsl(var(--primary)); }
  .tab-icon { font-size: 19px; }

  /* ---- FormFit's own flow (name entry, is-this-you, splash, chat) ---- */
  label.field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: hsl(var(--foreground)); font-weight: 500; margin-top: 0; }
  input[type="text"] {
    background: white; border: 1px solid hsl(var(--border)); color: hsl(var(--foreground));
    border-radius: 10px; padding: 10px 12px; font-size: 16px; font-family: inherit;
  }
  .card {
    background: hsl(var(--card)); border-radius: var(--radius); padding: 16px;
    border: 1px solid hsl(var(--border)); box-shadow: 0 2px 12px -4px hsl(231 80% 30% / .12);
  }
  .status-banner {
    text-align: center; font-size: 15px; font-weight: 600; padding: 12px;
    border-radius: 10px; background: hsl(var(--card-elevated)); color: hsl(var(--foreground));
    border: 1px solid hsl(var(--border));
  }
  #nameError.status-banner { background: hsl(0 84% 97%); color: hsl(var(--destructive)); border-color: hsl(0 84% 90%); }

  /* Buttons in the FormFit flow. Scoped to these screens so the home shell
     keeps its own button styles. */
  #screenNameEntry button, #screenIsThisYou button {
    font-family: inherit; font-size: 16px; font-weight: 700; padding: 14px 18px; border-radius: 10px;
    border: none; cursor: pointer; color: white; width: 100%;
    background: linear-gradient(135deg, hsl(var(--primary)), hsl(var(--primary-dark)));
    box-shadow: 0 8px 24px -8px hsl(var(--primary) / .4);
  }
  #screenNameEntry button:disabled { opacity: 0.5; cursor: default; box-shadow: none; }
  #screenIsThisYou button.secondary {
    background: none; box-shadow: none; color: hsl(var(--muted-foreground)); font-weight: 500; border: 1px solid hsl(var(--border));
  }

  .splash-center { display: flex; flex-direction: column; align-items: center; gap: 16px; padding-top: 30vh; }
  .splash-spinner {
    width: 40px; height: 40px; border-radius: 50%;
    border: 3px solid hsl(220 13% 91%); border-top-color: hsl(217 91% 60%);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #splashText { text-align: center; color: hsl(220 9% 46%); }

  /* The chat is position: fixed so it fills the screen height and escapes
     .app's padding. max-width keeps it phone-sized on desktop. */
  #screenChat {
    position: fixed; inset: 0; z-index: 20;
    width: 100%; max-width: 480px; margin: 0 auto;
    height: 100vh; height: 100dvh;
    background: white; display: flex; flex-direction: column; gap: 0;
  }

  .chat-header {
    flex-shrink: 0; background: hsl(var(--primary)); color: white;
    padding: max(20px, env(safe-area-inset-top)) 16px 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .chat-back-btn {
    background: none; border: none; color: white; font-size: 22px;
    line-height: 1; padding: 4px 6px 4px 0; cursor: pointer; flex-shrink: 0;
  }
  .chat-header-identity { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .chat-avatar {
    width: 38px; height: 38px; border-radius: 10px; background: hsl(0 0% 100% / .15);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    font-family: "Barlow Condensed", Inter, sans-serif; font-weight: 700; font-size: 15px;
    letter-spacing: -0.03em; color: white;
  }
  .chat-title { font-family: "Barlow Condensed", Inter, sans-serif; font-size: 17px; font-weight: 700; text-transform: uppercase; }
  .chat-subtitle { font-size: 12px; color: hsl(0 0% 100% / .8); }
  .chat-ai-pill {
    font-size: 10px; font-weight: 700; letter-spacing: 0.04em; padding: 4px 9px;
    border-radius: 999px; background: hsl(0 0% 100% / .18); flex-shrink: 0;
  }

  .equipment-strip {
    flex-shrink: 0; display: flex; gap: 8px; overflow-x: auto;
    background: hsl(var(--primary)); padding: 0 16px 14px;
    -webkit-overflow-scrolling: touch;
  }
  .equipment-strip::-webkit-scrollbar { display: none; }
  .equipment-chip {
    position: relative; flex-shrink: 0; display: flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 999px;
    background: transparent; border: 1px solid hsl(0 0% 100% / .4); color: white;
    font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .equipment-chip:disabled { opacity: 0.55; cursor: default; }
  .chip-badge {
    position: absolute; top: -7px; right: -6px;
    background: white; color: hsl(var(--primary-dark));
    font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em;
    padding: 2px 5px; border-radius: 999px; line-height: 1.4;
  }

  /* Photo picker button next to the chat input. Needs two classes to beat
     the generic .chat-input-row button rule below. */
  .chat-input-row .picker-open-btn {
    width: 42px; height: 42px; flex-shrink: 0; padding: 0; border-radius: 50%;
    background: hsl(var(--card)); color: hsl(var(--foreground)); border: 1px solid hsl(var(--border));
    font-size: 18px; font-family: inherit; display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: none;
  }

  /* Full-screen photo picker. Same layout as the chat, stacked on top of it. */
  .picker-overlay {
    position: fixed; inset: 0; z-index: 30;
    width: 100%; max-width: 480px; margin: 0 auto;
    height: 100vh; height: 100dvh;
    background: hsl(var(--background)); display: flex; flex-direction: column;
  }
  .picker-header {
    flex-shrink: 0; background: hsl(var(--primary)); color: white;
    padding: max(20px, env(safe-area-inset-top)) 16px 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .picker-title { font-family: "Barlow Condensed", Inter, sans-serif; font-size: 19px; font-weight: 700; text-transform: uppercase; }
  /* Simple list with small fixed-size thumbnails. Fixed pixel sizes on
     purpose: an aspect-ratio image in a grid made rows overlap in Chrome. */
  .picker-grid {
    flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: flex; flex-direction: column; gap: 8px; padding: 16px;
  }
  .picker-card {
    flex-shrink: 0; display: flex; align-items: center; gap: 12px;
    background: hsl(var(--card)); border: 1px solid hsl(var(--border)); border-radius: 12px;
    padding: 8px 14px 8px 8px; cursor: pointer; text-align: left;
  }
  .picker-card:disabled { opacity: 0.55; cursor: default; }
  .picker-card-photo {
    flex-shrink: 0; width: 52px; height: 52px; border-radius: 8px;
    object-fit: contain; background: white; display: block;
  }
  .picker-card-photo-placeholder {
    flex-shrink: 0; width: 52px; height: 52px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; background: hsl(var(--card-elevated)); color: hsl(var(--muted-foreground));
  }
  .picker-card-label {
    font-size: 14px; font-weight: 600; color: hsl(var(--foreground));
  }
  .picker-card-badge {
    margin-left: auto; flex-shrink: 0;
    background: hsl(var(--primary)); color: white;
    font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em;
    padding: 3px 7px; border-radius: 999px;
  }

  .chat-thread {
    flex: 1; min-height: 0; overflow-y: auto;
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    display: flex; flex-direction: column; gap: 10px;
    padding: 16px; background: hsl(var(--background));
  }
  .chat-bubble {
    flex-shrink: 0; max-width: 82%; padding: 10px 14px; border-radius: 16px;
    font-size: 14px; line-height: 1.45; white-space: pre-wrap;
  }
  .chat-bubble-bot {
    align-self: flex-start; background: hsl(var(--card));
    border-left: 3px solid hsl(var(--primary));
    color: hsl(var(--foreground)); border-bottom-left-radius: 4px;
  }
  .chat-bubble-user {
    align-self: flex-end; color: white; border-bottom-right-radius: 4px;
    background: hsl(var(--primary));
  }
  .chat-bubble-thinking {
    flex-shrink: 0; align-self: flex-start; background: hsl(var(--card));
    border-radius: 16px; border-bottom-left-radius: 4px;
    padding: 14px 16px; display: flex; gap: 4px;
  }
  .chat-bubble-thinking span {
    width: 6px; height: 6px; border-radius: 50%; background: hsl(var(--muted-foreground));
    animation: pulseDot 1s infinite ease-in-out;
  }
  .chat-bubble-thinking span:nth-child(2) { animation-delay: 0.15s; }
  .chat-bubble-thinking span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulseDot { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }

  /* Thumbs up/down row under a bot reply (see attachFeedbackUI). */
  .feedback-row { align-self: flex-start; display: flex; align-items: center; gap: 6px; margin-top: -4px; }
  .feedback-btn {
    background: none; border: 1px solid hsl(var(--border)); border-radius: 999px;
    width: 30px; height: 30px; font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .feedback-btn:active { background: hsl(var(--card)); }
  .feedback-thanks { font-size: 12px; color: hsl(var(--muted-foreground)); padding: 4px 2px; }
  .feedback-comment-row { display: flex; gap: 6px; width: 100%; max-width: 320px; }
  .feedback-comment-row input[type="text"] {
    flex: 1; font-size: 13px; padding: 7px 10px; border-radius: 8px;
  }
  .feedback-comment-row button {
    font-family: inherit; font-size: 12px; font-weight: 700; color: white;
    background: hsl(var(--primary)); border: none; border-radius: 8px; padding: 0 12px; cursor: pointer;
  }

  /* Machine setup card. The "Your Setup" numbers come straight from the
     engine, never from the model's wording, so they can't drift. */
  .chat-bubble-setup {
    flex-shrink: 0; max-width: 92%; padding: 0; overflow: hidden; border-radius: 16px;
    background: hsl(var(--card)); box-shadow: 0 2px 12px -4px hsl(231 80% 30% / .18);
  }
  .setup-header {
    background: hsl(var(--dark-navy)); color: hsl(var(--primary));
    padding: 12px 16px; font-family: "Barlow Condensed", Inter, sans-serif;
    font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em;
  }
  .setup-body { padding: 14px 16px; }
  .setup-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: hsl(var(--muted-foreground)); margin-bottom: 6px; }
  .setup-row { display: flex; justify-content: space-between; align-items: baseline; padding: 4px 0; font-size: 13px; }
  .setup-label { color: hsl(var(--muted-foreground)); }
  .setup-row-note { font-size: 12px; line-height: 1.4; color: hsl(var(--foreground) / .75); margin: 0 0 6px; }
  .setup-value { font-family: "Barlow Condensed", Inter, sans-serif; font-weight: 700; font-size: 15px; }
  .setup-section-header {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
    color: hsl(var(--primary-dark)); margin-top: 12px; margin-bottom: 4px; font-weight: 700;
  }
  .setup-why { margin: 0; font-size: 13px; line-height: 1.5; color: hsl(var(--foreground) / .9); }
  .setup-list { margin: 0; padding-left: 0; list-style: none; }
  .setup-list li { display: flex; gap: 8px; font-size: 13px; line-height: 1.5; margin-bottom: 5px; color: hsl(var(--foreground) / .9); }
  .setup-list li::before {
    content: ""; width: 5px; height: 5px; border-radius: 50%; background: hsl(var(--primary));
    margin-top: 6px; flex-shrink: 0;
  }

  .chat-input-bar {
    flex-shrink: 0; background: hsl(0 0% 100% / .95); backdrop-filter: blur(12px);
    border-top: 1px solid hsl(var(--border));
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  .chat-input-row { display: flex; align-items: center; gap: 8px; }
  .chat-input-row input[type="text"] { flex: 1; border-radius: 999px; background: hsl(var(--card)); }
  .chat-input-row button {
    width: 42px; height: 42px; flex-shrink: 0; padding: 0; border-radius: 50%;
    background: hsl(var(--primary)); color: white; border: none; font-size: 16px;
    font-family: inherit; display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 6px 16px -6px hsl(var(--primary) / .5);
  }
</style>
</head>
<body>
<div class="app">

  <!-- Home screen of a made-up gym app. Only the FormFit card and tab do
       anything, the rest is decoration. -->
  <section id="screenHome" class="screen">
    <div class="home-header">
      <div class="home-header-brand">
        <div class="app-logo">✨</div>
        <div class="gym-name">FitHub</div>
      </div>
      <div class="home-header-icons">
        <button class="icon-btn" type="button">🔍</button>
        <button class="icon-btn" type="button">🔔</button>
      </div>
    </div>

    <div>
      <p class="greeting-sub">Good morning,</p>
      <h1 id="greetingName" class="greeting-name">there 👋</h1>
    </div>

    <div class="today-card">
      <div class="today-card-top">
        <span class="today-label">TODAY</span>
        <span class="offpeak-pill">OFF-PEAK</span>
      </div>
      <div class="today-card-main">
        <div>
          <div class="today-count">51</div>
          <div class="today-sub">people training right now</div>
        </div>
        <svg class="pulse-icon" viewBox="0 0 60 30" fill="none">
          <polyline points="0,15 12,15 18,4 24,26 30,10 36,20 42,15 60,15" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <div class="today-bar"><div class="today-bar-fill" style="width: 58%"></div></div>
      <div class="today-bar-label">58%</div>
    </div>

    <div class="quick-actions">
      <button class="quick-action" type="button">
        <span class="quick-action-icon">📅</span>
        <span class="quick-action-label">BOOK</span>
      </button>
      <button class="quick-action" type="button">
        <span class="quick-action-icon">👥</span>
        <span class="quick-action-label">TRAINERS</span>
      </button>
      <button class="quick-action" type="button">
        <span class="quick-action-icon">📈</span>
        <span class="quick-action-label">STATS</span>
      </button>
    </div>

    <div class="section-heading-row">
      <span class="section-heading">Featured</span>
      <span class="section-heading-muted">For you</span>
    </div>

    <button id="formfitTile">
      <div class="featured-card-top">
        <span class="new-pill">NEW</span>
        <span class="featured-sparkle">✨</span>
      </div>
      <div class="formfit-tile-title">FormFit</div>
      <div class="formfit-tile-sub">Personalised machine setups, calculated from your measurements.</div>
      <span class="featured-cta">Open FormFit <span>→</span></span>
    </button>
  </section>

  <!-- FormFit entry flow -->
  <section id="screenNameEntry" class="screen" hidden>
    <h1>Welcome to FormFit</h1>
    <p>Enter your name to get started. We'll use it to find your
    measurements next time.</p>
    <label class="field">Your name
      <input id="nameInput" type="text" placeholder="e.g. Jake" />
    </label>
    <button id="nameContinueBtn">Continue</button>
    <div id="nameError" class="status-banner" hidden></div>
  </section>

  <section id="screenIsThisYou" class="screen" hidden>
    <h1>Welcome back</h1>
    <p id="isThisYouText"></p>
    <button id="isThisYouYesBtn">Yes, that's me</button>
    <button id="isThisYouNoBtn" class="secondary">No, I'm someone else</button>
  </section>

  <section id="screenSplash" class="screen" hidden>
    <div class="splash-center">
      <div class="splash-spinner"></div>
      <p id="splashText">Getting things ready…</p>
    </div>
  </section>

  <!-- Chat. Returning users and people coming back from the scan both land here. -->
  <section id="screenChat" class="screen" hidden>
    <header class="chat-header">
      <button id="chatBackBtn" class="chat-back-btn" type="button" aria-label="Back to home">←</button>
      <div class="chat-header-identity">
        <div class="chat-avatar">FF</div>
        <div>
          <div class="chat-title">FormFit</div>
          <div class="chat-subtitle">Your setup assistant</div>
        </div>
      </div>
      <span class="chat-ai-pill">AI</span>
    </header>

    <div id="equipmentStrip" class="equipment-strip"></div>
    <div id="chatThread" class="chat-thread"></div>

    <div class="chat-input-bar">
      <div class="chat-input-row">
        <button id="pickerOpenBtn" class="picker-open-btn" type="button" aria-label="Browse equipment with photos">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="4" y1="7" x2="20" y2="7" />
            <line x1="4" y1="12" x2="20" y2="12" />
            <line x1="4" y1="17" x2="20" y2="17" />
          </svg>
        </button>
        <input id="chatInput" type="text" placeholder="e.g. I'm at the chest press" />
        <button id="chatSendBtn" type="button" aria-label="Send">➤</button>
      </div>
    </div>
  </section>

</div>

<!-- Full-screen machine picker with photos, for people who don't know a
     machine by name. Tapping one sends its name, same as the chips. -->
<section id="pickerOverlay" class="picker-overlay" hidden>
  <header class="picker-header">
    <button id="pickerCloseBtn" class="chat-back-btn" type="button" aria-label="Close">←</button>
    <div class="picker-title">Choose your machine</div>
  </header>
  <div id="pickerGrid" class="picker-grid"></div>
</section>

<!-- Bottom tab bar, home screen only. Only Home and FormFit do anything. -->
<nav id="bottomTabBar" class="bottom-tab-bar">
  <div class="bottom-tab-bar-inner">
    <button class="tab-item tab-item-active" type="button"><span class="tab-icon">🏠</span><span class="tab-label">Home</span></button>
    <button class="tab-item" type="button"><span class="tab-icon">📅</span><span class="tab-label">Classes</span></button>
    <button class="tab-item" type="button"><span class="tab-icon">🏋️</span><span class="tab-label">Workouts</span></button>
    <button id="formfitTabItem" class="tab-item" type="button"><span class="tab-icon">🧍</span><span class="tab-label">FormFit</span></button>
    <button class="tab-item" type="button"><span class="tab-icon">🎟️</span><span class="tab-label">Activity</span></button>
  </div>
</nav>

<script type="module">
import { preloadPoseLandmarker } from "/scan/mediapipe_runner.mjs";

const API_BASE = window.location.origin; // same origin as the API

const screenHome = document.getElementById("screenHome");
const screenNameEntry = document.getElementById("screenNameEntry");
const screenIsThisYou = document.getElementById("screenIsThisYou");
const screenSplash = document.getElementById("screenSplash");
const screenChat = document.getElementById("screenChat");
const ALL_SCREENS = [screenHome, screenNameEntry, screenIsThisYou, screenSplash, screenChat];

const greetingName = document.getElementById("greetingName");
// Name from the last time someone went through FormFit on this device, if any.
const savedDisplayName = localStorage.getItem("formfit_display_name");
if (savedDisplayName) greetingName.textContent = `${savedDisplayName} 👋`;

const nameInput = document.getElementById("nameInput");
const nameContinueBtn = document.getElementById("nameContinueBtn");
const nameError = document.getElementById("nameError");
const isThisYouText = document.getElementById("isThisYouText");
const isThisYouYesBtn = document.getElementById("isThisYouYesBtn");
const isThisYouNoBtn = document.getElementById("isThisYouNoBtn");
const splashText = document.getElementById("splashText");
const equipmentStrip = document.getElementById("equipmentStrip");
const chatThread = document.getElementById("chatThread");
const chatInput = document.getElementById("chatInput");
const chatSendBtn = document.getElementById("chatSendBtn");
const chatBackBtn = document.getElementById("chatBackBtn");
const bottomTabBar = document.getElementById("bottomTabBar");
const pickerOpenBtn = document.getElementById("pickerOpenBtn");
const pickerCloseBtn = document.getElementById("pickerCloseBtn");
const pickerOverlay = document.getElementById("pickerOverlay");
const pickerGrid = document.getElementById("pickerGrid");

pickerOpenBtn.addEventListener("click", () => { pickerOverlay.hidden = false; });
pickerCloseBtn.addEventListener("click", () => { pickerOverlay.hidden = true; });

function showScreen(target) {
  for (const screen of ALL_SCREENS) screen.hidden = screen !== target;
  // The tab bar belongs to the home screen only.
  bottomTabBar.hidden = target !== screenHome;
}

// The other home screen buttons are decoration. Only FormFit works.
function enterFormFit() {
  showScreen(screenNameEntry);
  nameInput.focus();
}
document.getElementById("formfitTile").addEventListener("click", enterFormFit);
document.getElementById("formfitTabItem").addEventListener("click", enterFormFit);

let pendingName = null;
// True when the saved scan is older than the scan fix (api.py's
// SCAN_FORMULA_FIXED_ON), so "yes, that's me" goes back through the scan.
let pendingNeedsRescan = false;

function goToSplash(name, returning) {
  pendingName = name;
  // Name as typed, for the home screen greeting. Never sent anywhere.
  localStorage.setItem("formfit_display_name", name);
  showScreen(screenSplash);
  splashText.textContent = returning
    ? "Welcome back! Getting your setup ready…"
    : "Getting things ready for your scan…";

  // Start downloading the pose model while the splash shows, so the first
  // camera step doesn't freeze. Harmless if this person doesn't scan.
  preloadPoseLandmarker().catch(() => {}); // errors show up on the scan page itself

  setTimeout(() => {
    if (returning) {
      window.location.href = `${API_BASE}/?user_id=${encodeURIComponent(name)}&chat=1`;
    } else {
      window.location.href = `${API_BASE}/scan/scan.html?user_id=${encodeURIComponent(name)}`;
    }
  }, 1500);
}

// Letters, numbers, spaces, hyphens and apostrophes only. The name ends up
// in several URLs, and emoji can break encodeURIComponent.
const SAFE_NAME_PATTERN = /^[\p{L}\p{N} '-]+$/u;

nameContinueBtn.addEventListener("click", async () => {
  const name = nameInput.value.trim();
  nameError.hidden = true;
  if (!name) {
    nameError.hidden = false;
    nameError.textContent = "Enter your name to continue.";
    return;
  }
  if (!SAFE_NAME_PATTERN.test(name)) {
    nameError.hidden = false;
    nameError.textContent = "Please use only letters, numbers, and spaces in your name (no emoji or symbols).";
    return;
  }

  nameContinueBtn.disabled = true;
  nameContinueBtn.textContent = "Checking…";
  try {
    const res = await fetch(`${API_BASE}/profiles/${encodeURIComponent(name)}/exists`);
    const body = await res.json();
    if (body.exists) {
      pendingNeedsRescan = Boolean(body.needs_rescan);
      isThisYouText.textContent = pendingNeedsRescan
        ? `We found a profile named "${name}". Is that you? We've improved the scan since then, so we'll ask you to redo it (takes about a minute).`
        : `We found a profile named "${name}". Is that you?`;
      showScreen(screenIsThisYou);
    } else {
      goToSplash(name, false);
    }
  } catch (err) {
    nameError.hidden = false;
    nameError.textContent = `Couldn't reach the server: ${err.message}`;
  } finally {
    nameContinueBtn.disabled = false;
    nameContinueBtn.textContent = "Continue";
  }
});

isThisYouYesBtn.addEventListener("click", () => goToSplash(nameInput.value.trim(), !pendingNeedsRescan));

isThisYouNoBtn.addEventListener("click", () => {
  nameInput.value = "";
  showScreen(screenNameEntry);
  nameInput.focus();
});

// Chat. Friendly names for the chips and the picker. Tapping one just sends
// the name as a message, and the server works out which machine it is.
const MACHINE_INFO = {
  chest_press: { label: "Chest Press" },
  shoulder_press: { label: "Shoulder Press" },
  lat_pulldown: { label: "Lat Pulldown" },
  // pinHint: how to read the pin number on the machine itself (from the gym visit).
  pec_deck: { label: "Pec Deck (Chest Fly)", pinHint: (pin) => `With the pin in, the number showing on the seat post should be ${pin}.` },
  seated_row: { label: "Seated Row" },
  leg_extension: { label: "Leg Extension" },
  leg_curl: { label: "Leg Curl" },
  leg_press: { label: "Leg Press" },
};

// Machine photos for the picker, hosted in Supabase Storage (they're
// Matrix's photos, so they stay out of the repo). If one fails to load, the
// tile shows an icon instead.
const MACHINE_PHOTOS = {
  chest_press: "https://qeorztugpvicrjacwykd.supabase.co/storage/v1/object/public/machine-photos/chest_press.png",
  shoulder_press: "https://qeorztugpvicrjacwykd.supabase.co/storage/v1/object/public/machine-photos/shoulder_press.png",
  lat_pulldown: "https://qeorztugpvicrjacwykd.supabase.co/storage/v1/object/public/machine-photos/lat_pulldown.png",
  pec_deck: "https://qeorztugpvicrjacwykd.supabase.co/storage/v1/object/public/machine-photos/pec_deck.png",
  seated_row: "https://qeorztugpvicrjacwykd.supabase.co/storage/v1/object/public/machine-photos/seated_row.png",
};

// Same list as api.py's _UNSUPPORTED_MACHINES. They still answer when
// tapped, they just get a "Soon" badge.
const UNSUPPORTED_SLUGS = new Set(["leg_press", "leg_curl", "leg_extension", "lat_pulldown", "seated_row"]);

let currentUserId = null;

// Chat history lives in localStorage so it survives a refresh. The server
// doesn't keep transcripts. Capped so it can't grow forever.
const CHAT_HISTORY_LIMIT = 60;

function chatHistoryKey(userId) {
  return `formfit_chat_${userId}`;
}

function loadChatHistory(userId) {
  try {
    return JSON.parse(localStorage.getItem(chatHistoryKey(userId)) || "[]");
  } catch (err) {
    return []; // bad data, start fresh
  }
}

function logChatMessage(userId, entry) {
  const history = loadChatHistory(userId);
  history.push(entry);
  while (history.length > CHAT_HISTORY_LIMIT) history.shift();
  localStorage.setItem(chatHistoryKey(userId), JSON.stringify(history));
}

function replayChatHistory(history) {
  for (const entry of history) {
    if (entry.type === "setup") {
      appendMachineSetupMessage(entry.machine, entry.facts, entry.text);
    } else {
      appendMessage(entry.role, entry.text);
    }
  }
}

function renderEquipmentStrip(slugs) {
  equipmentStrip.innerHTML = "";
  for (const slug of slugs) {
    const info = MACHINE_INFO[slug] || { label: slug };
    const badge = UNSUPPORTED_SLUGS.has(slug) ? `<span class="chip-badge">Soon</span>` : "";
    const chip = document.createElement("button");
    chip.className = "equipment-chip";
    chip.innerHTML = `${badge}<span>${info.label}</span>`;
    chip.addEventListener("click", () => sendMessage(info.label));
    equipmentStrip.appendChild(chip);
  }
}

// Photo picker grid, built together with the chip strip.
function renderPickerGrid(slugs) {
  pickerGrid.innerHTML = "";
  for (const slug of slugs) {
    const info = MACHINE_INFO[slug] || { label: slug };
    const photoUrl = MACHINE_PHOTOS[slug];
    const badge = UNSUPPORTED_SLUGS.has(slug) ? `<span class="picker-card-badge">Soon</span>` : "";
    // No photo or a broken one: show the icon tile instead.
    const media = photoUrl
      ? `<img class="picker-card-photo" src="${photoUrl}" alt="${info.label}" loading="lazy" onerror="this.outerHTML='<div class=&quot;picker-card-photo-placeholder&quot;>🏋️</div>'" />`
      : `<div class="picker-card-photo-placeholder">🏋️</div>`;
    const card = document.createElement("button");
    card.className = "picker-card";
    card.type = "button";
    card.innerHTML = `${media}<span class="picker-card-label">${info.label}</span>${badge}`;
    card.addEventListener("click", () => {
      pickerOverlay.hidden = true;
      sendMessage(info.label);
    });
    pickerGrid.appendChild(card);
  }
}

async function loadEquipmentStrip() {
  try {
    const res = await fetch(`${API_BASE}/machines`);
    // Working machines first, then the "Soon" ones.
    const slugs = (await res.json()).sort((a, b) => UNSUPPORTED_SLUGS.has(a) - UNSUPPORTED_SLUGS.has(b));
    renderEquipmentStrip(slugs);
    renderPickerGrid(slugs);
  } catch (err) {
    equipmentStrip.hidden = true; // typing still works without the chips
  }
}

function appendMessage(role, text) {
  const bubble = document.createElement("div");
  bubble.className = `chat-bubble chat-bubble-${role}`;
  bubble.textContent = text;
  chatThread.appendChild(bubble);
  chatThread.scrollTop = chatThread.scrollHeight;
  return bubble;
}

function appendThinkingBubble() {
  const bubble = document.createElement("div");
  bubble.className = "chat-bubble-thinking";
  bubble.innerHTML = "<span></span><span></span><span></span>";
  chatThread.appendChild(bubble);
  chatThread.scrollTop = chatThread.scrollHeight;
  return bubble;
}

// Rows for the "Your Setup" block come from the engine's facts, not the
// model's wording.
function humanizeAxisName(axisName) {
  return axisName.replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
}

// Rows for things you can actually set (a pin), plus fixed parts that
// don't fit you. Notes under a row: the other pin when it's a close call,
// and how to read the number on the machine.
function factsToSetupRows(facts, machine) {
  const pinHint = (MACHINE_INFO[machine] || {}).pinHint;
  const rows = [];
  for (const f of facts || []) {
    const label = humanizeAxisName(f.axis_name);
    const hasPin = f.achieved_pin !== null && f.achieved_pin !== undefined;
    const notes = [];
    if (hasPin && f.alternative_pin !== null && f.alternative_pin !== undefined) {
      notes.push(f.user_cue || `Or pin ${f.alternative_pin}. Try both and keep whichever feels right.`);
    } else if (f.user_cue) {
      notes.push(f.user_cue);
    }
    if (hasPin && pinHint && f.axis_name === "Seat height") notes.push(pinHint(f.achieved_pin));

    if (f.verdict.startsWith("no_solution")) {
      rows.push({ label, value: "Not suitable", notes });
    } else if (hasPin) {
      rows.push({ label, value: f.achieved_pin === 0 ? "Pin 0 (lowest)" : `Pin ${f.achieved_pin}`, notes });
    } else if (notes.length) {
      rows.push({ label, value: "", notes });
    }
  }
  return rows;
}

// Splits the WHY/TIPS/AVOID reply into parts. Returns null if the model
// didn't use that format, and the raw text is shown instead.
function parseNarration(text) {
  const why = text.match(/^WHY:\s*(.+)$/m);
  if (!why) return null;
  const tips = text.match(/^TIPS:\s*(.+)$/m);
  const avoid = text.match(/^AVOID:\s*(.+)$/m);
  const splitItems = (m) => (m ? m[1].split("|").map((s) => s.trim()).filter(Boolean) : []);
  return { why: why[1].trim(), tips: splitItems(tips), avoid: splitItems(avoid) };
}

function appendMachineSetupMessage(machine, facts, narrationText) {
  const wrap = document.createElement("div");
  wrap.className = "chat-bubble-setup";

  const header = document.createElement("div");
  header.className = "setup-header";
  // Friendly machine name, e.g. "Pec Deck (Chest Fly)".
  header.textContent = (MACHINE_INFO[machine] || { label: humanizeAxisName(machine) }).label;
  wrap.appendChild(header);

  const body = document.createElement("div");
  body.className = "setup-body";
  wrap.appendChild(body);

  const title = document.createElement("div");
  title.className = "setup-title";
  title.textContent = "Your Setup";
  body.appendChild(title);

  for (const row of factsToSetupRows(facts, machine)) {
    const rowEl = document.createElement("div");
    rowEl.className = "setup-row";
    const labelEl = document.createElement("span");
    labelEl.className = "setup-label";
    labelEl.textContent = row.label;
    const valueEl = document.createElement("span");
    valueEl.className = "setup-value";
    valueEl.textContent = row.value;
    rowEl.appendChild(labelEl);
    rowEl.appendChild(valueEl);
    body.appendChild(rowEl);
    for (const note of row.notes) {
      const noteEl = document.createElement("p");
      noteEl.className = "setup-row-note";
      noteEl.textContent = note;
      body.appendChild(noteEl);
    }
  }

  const parsed = parseNarration(narrationText);
  if (parsed) {
    const whyHeader = document.createElement("div");
    whyHeader.className = "setup-section-header";
    whyHeader.textContent = "Why this works for you";
    body.appendChild(whyHeader);
    const whyBody = document.createElement("p");
    whyBody.className = "setup-why";
    whyBody.textContent = parsed.why;
    body.appendChild(whyBody);

    const addList = (heading, items) => {
      if (!items.length) return;
      const header = document.createElement("div");
      header.className = "setup-section-header";
      header.textContent = heading;
      body.appendChild(header);
      const list = document.createElement("ul");
      list.className = "setup-list";
      for (const item of items) {
        const li = document.createElement("li");
        li.textContent = item;
        list.appendChild(li);
      }
      body.appendChild(list);
    };
    addList("Technique tips", parsed.tips);
    addList("⚠️ Avoid", parsed.avoid);
  } else {
    // Reply wasn't in WHY/TIPS/AVOID format, so show it as is.
    const raw = document.createElement("p");
    raw.style.margin = "8px 0 0";
    raw.textContent = narrationText;
    body.appendChild(raw);
  }

  chatThread.appendChild(wrap);
  chatThread.scrollTop = chatThread.scrollHeight;
}

// Thumbs up/down under a bot reply. Failures are ignored so feedback never
// breaks the chat. Not shown again on old messages after a refresh.
function attachFeedbackUI(machine) {
  const row = document.createElement("div");
  row.className = "feedback-row";
  const upBtn = document.createElement("button");
  upBtn.className = "feedback-btn";
  upBtn.type = "button";
  upBtn.setAttribute("aria-label", "Helpful");
  upBtn.textContent = "👍";
  const downBtn = document.createElement("button");
  downBtn.className = "feedback-btn";
  downBtn.type = "button";
  downBtn.setAttribute("aria-label", "Not helpful");
  downBtn.textContent = "👎";
  row.appendChild(upBtn);
  row.appendChild(downBtn);
  chatThread.appendChild(row);
  chatThread.scrollTop = chatThread.scrollHeight;

  const sendFeedback = (rating, comment) => {
    fetch(`${API_BASE}/feedback/${encodeURIComponent(currentUserId)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ rating, machine, comment: comment || null }),
    }).catch(() => {}); // ignore failures, see above
  };

  const showThanks = (text) => {
    row.innerHTML = "";
    const thanks = document.createElement("span");
    thanks.className = "feedback-thanks";
    thanks.textContent = text;
    row.appendChild(thanks);
  };

  upBtn.addEventListener("click", () => {
    sendFeedback("up", null);
    showThanks("Thanks! 👍");
  });

  downBtn.addEventListener("click", () => {
    row.innerHTML = "";
    const commentRow = document.createElement("div");
    commentRow.className = "feedback-comment-row";
    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "What wasn't right? (optional)";
    const submitBtn = document.createElement("button");
    submitBtn.type = "button";
    submitBtn.textContent = "Send";
    commentRow.appendChild(input);
    commentRow.appendChild(submitBtn);
    row.appendChild(commentRow);
    chatThread.scrollTop = chatThread.scrollHeight;
    input.focus();

    const submit = () => {
      sendFeedback("down", input.value.trim());
      showThanks("Thanks for letting us know.");
    };
    submitBtn.addEventListener("click", submit);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") submit();
    });
  });
}

function rescanUrl(userId) {
  return `${API_BASE}/scan/scan.html?user_id=${encodeURIComponent(userId)}`;
}

function appendRescanButton() {
  const row = document.createElement("div");
  row.className = "feedback-comment-row";
  const btn = document.createElement("button");
  btn.type = "button";
  btn.style.padding = "10px 14px";
  btn.textContent = "Redo my scan";
  btn.addEventListener("click", () => { window.location.href = rescanUrl(currentUserId); });
  row.appendChild(btn);
  chatThread.appendChild(row);
  chatThread.scrollTop = chatThread.scrollHeight;
}

async function sendMessage(text) {
  const trimmed = text.trim();
  if (!trimmed || !currentUserId) return;

  appendMessage("user", trimmed);
  logChatMessage(currentUserId, { type: "text", role: "user", text: trimmed });
  chatInput.value = "";
  chatInput.disabled = true;
  chatSendBtn.disabled = true;
  const thinking = appendThinkingBubble();

  try {
    const res = await fetch(`${API_BASE}/assistant/${encodeURIComponent(currentUserId)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: trimmed }),
    });
    // A crash or a proxy timeout can answer with plain text, not JSON.
    const body = await res.json().catch(() => ({}));
    thinking.remove();
    if (!res.ok) {
      // Errors aren't saved to history. They stay loud on purpose so
      // testers report them right away.
      appendMessage("bot", `Something went wrong: ${body.detail || `the server returned an error (${res.status})`}`);
    } else if (body.kind === "rescan") {
      // Not saved and no thumbs: it's a prompt, not an answer.
      appendMessage("bot", body.reply);
      appendRescanButton();
    } else if (body.kind === "machine_setup") {
      appendMachineSetupMessage(body.machine, body.facts, body.reply);
      logChatMessage(currentUserId, { type: "setup", machine: body.machine, facts: body.facts, text: body.reply });
      attachFeedbackUI(body.machine);
    } else {
      appendMessage("bot", body.reply);
      logChatMessage(currentUserId, { type: "text", role: "bot", text: body.reply });
      attachFeedbackUI(body.machine || null);
    }
  } catch (err) {
    thinking.remove();
    // err.name helps tell a bad URL apart from a real network problem.
    appendMessage("bot", `Couldn't reach the server: ${err.name}: ${err.message}`);
  } finally {
    chatInput.disabled = false;
    chatSendBtn.disabled = false;
    chatInput.focus();
  }
}

chatSendBtn.addEventListener("click", () => sendMessage(chatInput.value));
chatInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendMessage(chatInput.value);
});

// Back to the home screen. Nothing is lost, the chat is still there next time.
chatBackBtn.addEventListener("click", () => showScreen(screenHome));

function enterChat(userId, greeting) {
  currentUserId = userId;
  localStorage.setItem("formfit_user_id", userId);
  showScreen(screenChat);
  chatThread.innerHTML = "";

  const history = loadChatHistory(userId);
  if (history.length > 0) {
    // Coming back: replay the conversation instead of greeting again.
    replayChatHistory(history);
  } else {
    appendMessage("bot", greeting);
    logChatMessage(userId, { type: "text", role: "bot", text: greeting });
  }

  loadEquipmentStrip();
  chatInput.focus();
}

// People coming from the scan (?from=scan) or confirming "that's me"
// (?chat=1) go straight to the chat.
(function handleArrivalParams() {
  const params = new URLSearchParams(window.location.search);
  const arrivingUserId = params.get("user_id");
  const fromScan = params.get("from") === "scan";
  const wantsChat = params.get("chat") === "1";

  if (arrivingUserId && (fromScan || wantsChat)) {
    // The URL carries the lowercased id; greet with the name as typed when we have it.
    const typedName = localStorage.getItem("formfit_display_name");
    const shownName =
      typedName && typedName.trim().toLowerCase() === arrivingUserId.trim().toLowerCase() ? typedName : arrivingUserId;
    const greeting = fromScan
      ? `Thanks for scanning, ${shownName}! Tell me which machine you're at (or tap one below) and I'll get you set up.`
      : `Welcome back, ${shownName}! Tell me which machine you're at (or tap one below) and I'll get you set up.`;
    enterChat(arrivingUserId, greeting);
    return;
  }

  const savedUserId = localStorage.getItem("formfit_user_id");
  if (savedUserId) {
    // Known user on this device: straight into the chat.
    enterChat(savedUserId, "Welcome back!");
    return;
  }

  showScreen(screenHome);
})();
</script>
